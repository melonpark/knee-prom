<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>무릎 기능 설문</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#F6F8F7;--paper:#FFF;--ink:#16212B;--ink-2:#4B5763;--line:#D9DED9;--sel:#2E6B4F;--sel-soft:#E4F0EA;--warn:#9B3B2E;--ok:#1B7F5C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45;padding-bottom:120px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
header h1{font-size:20px;font-weight:700}header h1 small{font-weight:400;color:var(--ink-2);font-size:13px;margin-left:8px}
.mode{font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--paper);white-space:nowrap}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps span.done{background:var(--ok)}.steps span.cur{background:var(--sel)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 b{font-weight:600;color:var(--ink);font-size:16px}.card h2 .pts{font-size:13px;font-weight:400;text-align:right}
.intro{font-size:15px;color:var(--ink-2);margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .full{grid-column:1/-1}
label.f{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=date],input[type=number]{width:100%;font:inherit;font-size:18px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#FAFBFA;color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}.seg button{flex:1;min-width:60px;font:inherit;font-size:15px;padding:11px 4px;border:0;background:#FAFBFA;color:var(--ink-2);cursor:pointer}.seg button.on{background:var(--sel);color:#fff}
.q{border-top:1px solid var(--line);padding:14px 0}.q:first-child{border-top:0;padding-top:4px}
.q .t{font-size:17px;font-weight:600;margin-bottom:8px;display:flex;gap:8px}.q .t .no{color:var(--ink-2);font-weight:500;min-width:30px;flex-shrink:0}
.sidelab{font-size:14px;color:var(--sel);font-weight:600;margin:6px 0 4px}
.scale{display:flex;gap:6px;flex-wrap:wrap}.scale button{flex:1;min-width:42px;font:inherit;font-size:18px;font-weight:600;min-height:50px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-2);cursor:pointer}.scale button.on{background:var(--sel);border-color:var(--sel);color:#fff}
.anchors{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:4px;padding:0 4px}.anchors.big{font-size:16px;font-weight:600;color:var(--ink);margin:2px 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;font-size:16px;text-align:left;width:100%;min-height:48px}
.opt .pt{font-size:13px;color:var(--ink-2);flex-shrink:0}.opt.on{background:var(--sel-soft);border-color:var(--sel);color:var(--sel)}.opt.on .pt{color:var(--sel);font-weight:600}
.opts.row{flex-direction:row;flex-wrap:wrap}.opts.row .opt{width:auto;flex:1 1 auto;justify-content:center;min-height:44px;padding:9px 12px;font-size:15px}
.chk{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;cursor:pointer;user-select:none}.chk input{width:22px;height:22px;accent-color:var(--sel)}
.sub{display:flex;justify-content:space-between;font-size:15px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}.sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--ink-2);margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px;box-shadow:0 -6px 20px rgba(22,33,43,.06)}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}.bar .st{font-size:14px;color:var(--ink-2)}.bar .miss{font-size:13px;color:var(--warn)}
.btns{margin-left:auto;display:flex;gap:8px}
.btn{font:inherit;font-size:16px;font-weight:600;padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.p{background:var(--sel);color:#fff;border-color:var(--sel)}.btn.big{width:100%;padding:16px;font-size:18px}.btn:disabled{opacity:.4;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.qrwrap{text-align:center;padding:8px 0}.qrwrap>div:first-child{display:inline-block;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qrurl{font-size:12px;color:var(--ink-2);word-break:break-all;margin-top:8px}
.summary{width:100%;border-collapse:collapse;font-size:16px}.summary td{padding:9px 4px;border-top:1px solid var(--line)}.summary td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.summary tr.h td{font-weight:700;color:var(--sel);border-top:2px solid var(--line)}
.done{text-align:center;padding:16px 8px}.done .big{font-size:26px;font-weight:700;margin-bottom:6px}.done p{color:var(--ink-2)}
.savebox{text-align:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:#FAFBFA}.savebox .sv{font-size:19px;font-weight:600}.savebox.ok{background:#E8F5EE;border-color:var(--ok);color:var(--ok)}.savebox.err{background:#FBECEA;border-color:var(--warn);color:var(--warn)}.savebox .tools{display:none;justify-content:center;margin-top:10px}.savebox.err .tools{display:flex}
.hidden{display:none!important}
.dx{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center;font-size:15px}.dx .seg{min-width:120px}.dx input{padding:8px;font-size:15px;width:90px}
@media (max-width:520px){.grid{grid-template-columns:1fr}.dx{grid-template-columns:1fr auto}.dx input{grid-column:2}}
@media print{.bar,.tools,.mode,.steps,.noprint{display:none!important}body{background:#fff;padding:0}.card{break-inside:avoid;border-color:#bbb}}
</style></head><body><div class="wrap">
<header><h1>무릎 기능 설문 <small>서울성모병원 정형외과</small></h1><span class="mode" id="modeTag">외래</span></header>
<div class="steps" id="steps"></div>

<div class="page" data-page="info">
<section class="card"><h2><b>환자 정보</b><span class="pts">직원 입력</span></h2>
  <div class="grid">
    <div><label class="f">등록번호</label><input type="text" id="pid" inputmode="numeric" placeholder="예) 12345678"></div>
    <div><label class="f">이름 (선택)</label><input type="text" id="pname" placeholder="홍길동"></div>
    <div><label class="f">작성일</label><input type="date" id="pdate"></div>
    <div><label class="f">지표 무릎</label><div class="seg" data-key="side"><button data-v="R">오른쪽</button><button data-v="L">왼쪽</button><button data-v="B">양측</button></div></div>
    <div class="full"><label class="f">구분</label><div class="seg" data-key="track"><button data-v="tkra">1. TKRA</button><button data-v="lig">2. 인대 손상</button><button data-v="inj">3. 주사 치료</button></div></div>
    <div class="full"><label class="f">시점</label><div class="seg" data-key="visit" id="visitSeg"></div></div>
    <div class="full"><label class="f">시행할 설문</label><div class="opts row" id="useBox"></div></div>
  </div>
</section>
<section class="card noprint" id="qrCard"><h2><b>환자 휴대폰으로 보내기</b><span class="pts">문자 발송 또는 QR</span></h2>
  <div class="tools"><button class="btn" id="bQR">QR 만들기</button><button class="btn" id="bLink">링크 복사</button></div>
  <div class="qrwrap hidden" id="qrbox"><div id="qr"></div><div class="qrurl" id="qrurl"></div></div>
</section>
<button class="btn p big" id="bStart">환자에게 태블릿 건네기 →</button>
</div>

<div id="pages"></div>

<div class="page hidden" data-page="done">
<section class="card"><div class="done"><div class="big">작성이 끝났습니다. 감사합니다.</div><p id="doneMsg"></p></div>
  <div class="savebox" id="saveBox"><div class="sv" id="saveMsg">저장 중…</div><div class="tools"><button class="btn" id="bRetry">다시 저장</button><button class="btn" id="bShowQR">QR로 대신 전달</button></div></div>
  <div class="qrwrap hidden" id="qr2box"><div id="qr2"></div><p class="hint">진료실에서 이 QR 코드를 보여주세요.</p></div></section>
<section class="card" id="staffCard"><h2><b>결과 요약</b><span class="pts" id="sumMeta"></span></h2><table class="summary" id="sumTbl"></table></section>
<section class="card noprint" id="toolCard"><h2><b>직원 메뉴</b></h2>
  <div class="tools"><button class="btn" id="bCopy">EMR 형식 복사</button><button class="btn" id="bCSV">CSV 다운로드</button><button class="btn" id="bJSON">JSON 다운로드</button><button class="btn" id="bPrint">인쇄 / PDF</button><button class="btn" id="bSend">시트로 전송</button><button class="btn p" id="bNew">새 환자</button></div>
  <div class="hint" id="sendHint"></div></section>
</div>
</div>
<div class="bar"><div class="in"><span class="st" id="stepTag"></span><span class="miss" id="missTag"></span>
  <div class="btns"><button class="btn" id="bPrev">이전</button><button class="btn p" id="bNext">다음 →</button></div></div></div>

<script>
(function(){
const SAVE_URL='https://script.google.com/macros/s/AKfycbz8uieVLoXPlstVlUElznMsszJ03l4vVTTjdgmrCqHuUup6HEkULPTO_Lnd-Q6EyzHCJg/exec';   // Google Apps Script 웹앱 URL

  lig:[['6m','6개월'],['1y','1년'],['2y','2년'],['other','기타']],

const TRACK_INST={tkra:['womac','sf36','pd','csi'],lig:['ikdc','koos','lysholm'],inj:['womac','sf36']};

// ===================== 설문 정의 =====================

const SC04=[0,1,2,3,4];

 func:['계단을 내려갈 때','계단을 올라갈 때','앉아 있다가 일어설 때','서 있을 때','바닥에 몸을 구부릴 때','평지를 걸을 때','승용차나 버스를 타거나 내릴 때','시장을 보러 갈 때','양말이나 스타킹을 신을 때','이부자리에서 일어날 때','양말이나 스타킹을 벗을 때','이부자리에 누울 때','욕조에 들어가고 나올 때','(의자에) 앉아 있을 때','양변기에 앉거나 일어설 때','힘든 일을 할 때','가벼운 일을 할 때']};

    const mean=keys=>{const v=keys.map(k=>rc[k](a[k])).filter(x=>x!==null);return v.length?R1(v.reduce((s,x)=>s+x,0)/v.length):null;};

 csi:{name:'중추신경 감작 조사지',sub:'Central Sensitization Inventory',intro:'본인이 해당하는 정도에 표시하세요. 0 전혀 아니다 · 1 거의 아니다 · 2 가끔 그렇다 · 3 자주 그렇다 · 4 항상 그렇다',

};
const ans={};for(const k in INST)ans[k]={};
let use={};

// ===================== 렌더링 (데이터 → DOM) =====================
function buildInst(id){const I=INST[id];const pg=document.createElement('div');pg.className='page hidden';pg.dataset.page=id;
  pg.innerHTML=`<section class="card"><div class="intro"><b>${I.name}</b> ${I.sub?'· '+I.sub:''}<br>${I.intro}</div></section>`;
  I.sections().forEach(sec=>{const s=document.createElement('section');s.className='card';if(sec.h)s.innerHTML=`<h2><b style="font-weight:600;font-size:15px;line-height:1.4">${sec.h}</b></h2>`;
    sec.items.forEach(it=>{const sd=it.side&&I.bilateral?sides():[''];sd.forEach(side=>{const key=side?it.k+'_'+side:it.k;const q=document.createElement('div');q.className='q';q.dataset.inst=id;q.dataset.key=key;
      let html=`<div class="t">${it.no!==undefined?`<span class="no">${it.no}.</span>`:''}<span>${it.t}</span></div>`;if(side)html+=`<div class="sidelab">${SIDE_KO[side]} 무릎</div>`;
      if(it.type==='scale')html+=`<div class="scale">${it.vals.map(v=>`<button data-v="${v}">${v}</button>`).join('')}</div>`;
      else if(it.type==='opts')html+=`<div class="opts${it.row?' row':''}">${it.labels.map((l,i)=>`<button class="opt" data-v="${it.vals[i]}">${l}${it.pts?`<span class="pt">${it.vals[i]}</span>`:''}</button>`).join('')}</div>`;
      else if(it.type==='yn')html+=`<div class="seg" style="max-width:260px"><button data-v="${it.vals[0]}">예</button><button data-v="${it.vals[1]}">아니오</button></div>`;
      else if(it.type==='dx')html=`<div class="dx"><span>${it.t}</span><div class="seg"><button data-v="0">아니오</button><button data-v="1">예</button></div><input type="number" placeholder="진단연도" inputmode="numeric" data-year="${key}"></div>`;
      q.innerHTML=html;q.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{ans[id][key]=+b.dataset.v;render();});
      const yr=q.querySelector('input[data-year]');if(yr)yr.addEventListener('input',e=>{ans[id][key+'_yr']=e.target.value;});
      s.appendChild(q);});});
    pg.appendChild(s);});
  const sc=document.createElement('section');sc.className='card';sc.innerHTML=`<h2><b>${I.name} 점수</b></h2><div id="sc_${id}"></div>`;pg.appendChild(sc);
  return pg;}
function buildAll(){$('#pages').innerHTML='';for(const id in INST)$('#pages').appendChild(buildInst(id));}
function missingIn(id){let m=0;$$(`.page[data-page=${id}] .q`).forEach(q=>{if(q.querySelector('.dx'))return;if(ans[id][q.dataset.key]==null)m++;});return m;}

// ===================== 흐름 =====================
let pages=['info','done'],cur=0;
const PT={info:'환자 정보',done:'완료'};
const visitLabel=()=>{const v=(VISITS[seg.track]||[]).find(x=>x[0]===seg.visit);return v?v[1]:'';};
function buildPages(){pages=['info'];(TRACK_INST[seg.track]||[]).forEach(i=>{if(use[i])pages.push(i);});pages.push('done');}
function renderInfo(){const vs=VISITS[seg.track]||[];$('#visitSeg').innerHTML=vs.map(([v,l])=>`<button data-v="${v}">${l}</button>`).join('');$$('#visitSeg button').forEach(b=>b.onclick=()=>{seg.visit=b.dataset.v;render();});
  const ins=TRACK_INST[seg.track]||[];$('#useBox').innerHTML=ins.map(i=>`<label class="chk"><input type="checkbox" data-use="${i}" ${use[i]!==false?'checked':''}>${INST[i].name}</label>`).join('');
  $$('#useBox input').forEach(c=>c.onchange=()=>{use[c.dataset.use]=c.checked;});ins.forEach(i=>{if(use[i]===undefined)use[i]=true;});}
function missing(p){return p==='info'?(($('#pid').value&&seg.side&&seg.track&&seg.visit)?0:1):p==='done'?0:missingIn(p);}
function go(i){cur=Math.max(0,Math.min(pages.length-1,i));$$('.page').forEach(p=>p.classList.toggle('hidden',p.dataset.page!==pages[cur]));window.scrollTo(0,0);if(pages[cur]==='done')onDone();render();}
function render(){
  $$('.seg[data-key]').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',seg[s.dataset.key]===b.dataset.v)));
  $$('.q[data-inst]').forEach(q=>{const v=ans[q.dataset.inst][q.dataset.key];q.querySelectorAll('button[data-v]').forEach(b=>b.classList.toggle('on',v!=null&&+b.dataset.v===v));});
  for(const id in INST){const el=$('#sc_'+id);if(el)el.innerHTML=INST[id].score(ans[id]).map(([l,v])=>`<div class="sub"><span>${l}</span><b>${v??'—'}</b></div>`).join('');}
  $('#steps').innerHTML=pages.map((p,i)=>`<span class="${i<cur?'done':i===cur?'cur':''}"></span>`).join('');
  const p=pages[cur],m=missing(p);
  $('#stepTag').textContent=`${cur+1} / ${pages.length} · ${PT[p]||(INST[p]||{}).name||''}`;
  $('#missTag').textContent=m?(p==='info'?'등록번호·무릎·구분·시점 필요':`미응답 ${m}개`):'';
  $('#bNext').disabled=m>0;$('#bNext').textContent=cur===pages.length-2?'완료':'다음 →';
  $('#bPrev').classList.toggle('hidden',cur===0||p==='done');$('#bNext').classList.toggle('hidden',p==='done'||p==='info');
  $('.bar').classList.toggle('hidden',p==='done'&&MODE==='patient');
  if(p==='done')renderSummary();
}
$('#bNext').onclick=()=>go(cur+1);$('#bPrev').onclick=()=>go(cur-1);
$('#bStart').onclick=()=>{if(missing('info')){alert('등록번호, 지표 무릎, 구분, 시점을 모두 입력하세요.');return;}buildAll();buildPages();go(1);};
$$('.seg[data-key]').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=s.dataset.key;seg[k]=b.dataset.v;if(k==='track'){seg.visit='';use={};renderInfo();}render();}));
['pid','pname'].forEach(id=>$('#'+id).addEventListener('input',render));

// ===================== 데이터 =====================
const info=()=>({pid:$('#pid').value,name:$('#pname').value,date:$('#pdate').value,side:seg.side,track:seg.track,visit:seg.visit});
function record(){const r=info();const o={...r,side_ko:SIDE_KO[r.side]||'',track_ko:TRACK_KO[r.track]||'',visit_ko:visitLabel()};
  for(const id of pages.filter(p=>INST[p])){for(const k in ans[id])o[id+'_'+k]=ans[id][k]??'';INST[id].score(ans[id]).forEach(([l,v],i)=>o[id+'_score'+(i+1)+'_'+l.replace(/[^\w가-힣]+/g,'_')]=v??'');}
  o.mode=MODE;o.saved_at=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Seoul'});return o;}
function emrText(){const r=info(),L=[];
  for(const id of pages.filter(p=>INST[p])){const I=INST[id];L.push(`[${I.name}] ${SIDE_KO[r.side]||''} 무릎 · ${visitLabel()} · ${r.date}`);
    I.sections().forEach(sec=>sec.items.forEach(it=>{const sd=it.side&&I.bilateral?sides():[''];sd.forEach(side=>{const key=side?it.k+'_'+side:it.k;const v=ans[id][key];let lab=v;
      if(it.type==='opts'&&v!=null){const i=it.vals.indexOf(v);lab=it.labels[i]+(it.pts?'':` (${v})`);}if(it.type==='yn'&&v!=null)lab=v===it.vals[0]?'예':'아니오';if(it.type==='dx'){lab=v==null?'':(v?'예'+(ans[id][key+'_yr']?' ('+ans[id][key+'_yr']+')':''):'아니오');}
      L.push(`${it.no!==undefined?it.no+'. ':''}${it.t}${side?' ['+SIDE_KO[side]+']':''} : ${lab??''}`);});}));
    I.score(ans[id]).forEach(([l,v])=>L.push(`${l} : ${v??''}`));L.push('');}
  return L.join('\n');}
function renderSummary(){const r=info();$('#sumMeta').textContent=`${r.pid} ${r.name} · ${TRACK_KO[r.track]||''} · ${SIDE_KO[r.side]||''} 무릎 · ${visitLabel()} · ${r.date}`;let h='';
  for(const id of pages.filter(p=>INST[p])){h+=`<tr class="h"><td colspan="2">${INST[id].name}</td></tr>`+INST[id].score(ans[id]).map(([l,v])=>`<tr><td>${l}</td><td>${v??'—'}</td></tr>`).join('');}
  $('#sumTbl').innerHTML=h;}

// ===================== URL / QR =====================
const baseURL=()=>location.origin+location.pathname;
const answerString=()=>JSON.stringify(Object.fromEntries(pages.filter(p=>INST[p]).map(p=>[p,ans[p]])));
const useString=()=>Object.keys(use).filter(k=>use[k]).join(',');
const patientURL=()=>{const r=info();return baseURL()+'?'+new URLSearchParams({mode:'patient',...r,u:useString()});};
const resultURL=()=>{const r=info();return baseURL()+'?'+new URLSearchParams({...r,u:useString(),a:answerString()});};
const makeQR=(el,t)=>{el.innerHTML='';new QRCode(el,{text:t,width:240,height:240,correctLevel:QRCode.CorrectLevel.L});};
$('#bQR').onclick=()=>{if(!$('#pid').value||!seg.track){alert('등록번호와 구분을 먼저 입력하세요.');return;}$('#qrbox').classList.remove('hidden');makeQR($('#qr'),patientURL());$('#qrurl').textContent=patientURL();};
$('#bLink').onclick=()=>{if(!$('#pid').value||!seg.track){alert('등록번호와 구분을 먼저 입력하세요.');return;}navigator.clipboard.writeText(patientURL()).then(()=>{$('#bLink').textContent='복사됨';setTimeout(()=>$('#bLink').textContent='링크 복사',1200);});};

// ===================== 완료 / 저장 =====================
const dl=(name,text,type)=>{const el=document.createElement('a');el.href=URL.createObjectURL(new Blob([text],{type}));el.download=name;el.click();};
const fname=ext=>{const r=info();return `KNEE_${r.pid||'noid'}_${r.track||''}_${r.visit||'visit'}_${r.date}.${ext}`;};
$('#bJSON').onclick=()=>dl(fname('json'),JSON.stringify(record(),null,2),'application/json');
$('#bCSV').onclick=()=>{const r=record();dl(fname('csv'),'﻿'+Object.keys(r).join(',')+'\n'+Object.values(r).map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','),'text/csv');};
$('#bCopy').onclick=()=>navigator.clipboard.writeText(emrText()).then(()=>{$('#bCopy').textContent='복사됨';setTimeout(()=>$('#bCopy').textContent='EMR 형식 복사',1200);});
$('#bPrint').onclick=()=>window.print();$('#bNew').onclick=()=>location.href=baseURL();
function setSave(state,msg){$('#saveBox').className='savebox '+state;$('#saveMsg').textContent=msg;$('#sendHint').textContent=msg;}
async function send(){if(!SAVE_URL){setSave('err','저장 설정이 되어 있지 않습니다 (SAVE_URL 비어 있음)');return false;}
  setSave('','저장 중…');const r=record();
  try{const res=await fetch(SAVE_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(r)});const t=(await res.text()).trim();
    if(res.ok&&t==='ok'){setSave('ok',`✅ 저장 완료 — 등록번호 ${r.pid} · ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`);return true;}
    setSave('err','❌ 저장 실패 (서버 응답: '+(t||res.status)+') — 다시 저장을 누르거나 QR로 전달하세요');return false;}
  catch(e){setSave('err','❌ 저장 실패 (인터넷 연결 확인) — 다시 저장을 누르거나 QR로 전달하세요');return false;}}
$('#bSend').onclick=send;$('#bRetry').onclick=send;$('#bShowQR').onclick=()=>{$('#qr2box').classList.remove('hidden');makeQR($('#qr2'),resultURL());};
function onDone(){const patient=MODE==='patient';$('#staffCard').classList.toggle('hidden',patient);$('#toolCard').classList.toggle('hidden',patient);$('#qr2box').classList.add('hidden');
  $('#doneMsg').textContent=patient?'답변이 병원으로 전송됩니다. 아래 "저장 완료"를 확인한 뒤 창을 닫으셔도 됩니다.':'태블릿을 직원에게 돌려주세요.';send();
  if(AUTO_RESET_SEC&&!patient)setTimeout(()=>location.href=baseURL(),AUTO_RESET_SEC*1000);}

// ===================== 초기화 =====================
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
$('#pdate').value=today();
if(P.get('pid'))$('#pid').value=P.get('pid');if(P.get('name'))$('#pname').value=P.get('name');if(P.get('date'))$('#pdate').value=P.get('date');
['side','track','visit'].forEach(k=>{if(P.get(k))seg[k]=P.get(k);});
renderInfo();if(P.get('u')){const s=new Set(P.get('u').split(','));(TRACK_INST[seg.track]||[]).forEach(i=>use[i]=s.has(i));renderInfo();}
if(MODE==='patient'){$('#modeTag').textContent='환자 입력';$('#qrCard').classList.add('hidden');if(P.get('pid')){$('#pid').readOnly=true;$('#pname').readOnly=true;}else{$('#pid').placeholder='진료카드/접수증의 등록번호';}$('#bStart').textContent='설문 시작 →';}
if(P.get('a')){try{const a=JSON.parse(P.get('a'));buildAll();for(const k in a)ans[k]=a[k];buildPages();go(pages.length-1);}catch(e){go(0);}}else go(0);
})();
</script></body></html>
